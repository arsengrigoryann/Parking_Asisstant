[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parking-assistant"
version = "0.1.0"
description = "Production-oriented parking assistant foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0.54,<2.1",
    "weaviate-client>=4.23,<5",
    "langchain-openai>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "langsmith>=0.4,<1",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langchain[mcp]>=1.4.2,<1.5",
    "mcp>=2.2,<3",
    "filelock>=3.19,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "langgraph-cli[inmem]>=0.4,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parking_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests requiring local external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
